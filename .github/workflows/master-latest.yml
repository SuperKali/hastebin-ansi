name: main-latest

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  #schedule:
  #  - cron: '0 3 * * *' # Scheduled runs every day at 3am UTC

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: image
        # ghcr.io needs a lowercase owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/ansi-hastebin" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      #- name: Log in to Docker Hub
      #  uses: docker/login-action@v3
      #  with:
      #    username: ${{ secrets.DOCKER_USERNAME }}
      #    password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }} # github username or org
          password: ${{ secrets.GITHUB_TOKEN }}    # github actions builtin token

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true # avoid bitrot with repeated cache hits
          push: true
          tags: ${{ steps.image.outputs.name }}:latest,${{ steps.image.outputs.name }}:0.0.9 # @TODO: read from package.json
          labels: |
            org.opencontainers.image.title=ansi-hastebin
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
          cache-from: type=gha,scope=default # all-automatic Github Actions caching
          cache-to: type=gha,mode=max,scope=default

      - name: Build and push Pterodactyl image
        id: docker_build_pterodactyl
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: pterodactyl
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.image.outputs.name }}:pterodactyl,${{ steps.image.outputs.name }}:pterodactyl-${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.title=ansi-hastebin
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
          cache-from: type=gha,scope=pterodactyl
          cache-to: type=gha,mode=max,scope=pterodactyl
