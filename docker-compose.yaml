version: '3.0'
services:
  haste-server:
    build: .
    environment:
      - STORAGE_TYPE=file
      - STORAGE_FILE_PATH=/app/pastes
    ports:
      - "7777:7777"
    # The image runs as uid 65532. Make ./data writable first:
    #   sudo chown -R 65532:65532 ./data
    volumes:
      - ./config.yaml:/app/config.yaml
      - "./data:/app/pastes"
